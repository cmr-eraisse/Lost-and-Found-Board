<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>History — Lost & Found Board</title>
		<link rel="stylesheet" href="style.css" />
		<style>
			.history-controls {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				align-items: center;
				margin: 24px 0 16px;
			}

			.summary-cards {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
				gap: 16px;
				margin: 24px 0;
			}

			.summary-card {
				background: var(--surface);
				border-radius: var(--radius);
				padding: 20px;
				text-align: center;
				box-shadow: var(--shadow);
			}

			.summary-card .number {
				font-family: "DM Serif Display", serif;
				font-size: 2.2rem;
				line-height: 1;
				margin-bottom: 4px;
			}

			.summary-card .label {
				font-size: 0.82rem;
				color: var(--muted);
				font-weight: 500;
				text-transform: uppercase;
				letter-spacing: 0.04em;
			}

			.summary-card.lost-card .number {
				color: var(--red);
			}
			.summary-card.found-card .number {
				color: var(--blue);
			}
			.summary-card.claimed-card .number {
				color: var(--green);
			}
			.summary-card.open-card .number {
				color: var(--amber);
			}
		</style>
	</head>
	<body>
		<nav>
			<div class="nav-links">
				<a href="dashboard.html">Board</a>
				<a href="add.html">Add Item</a>
				<a href="history.html" class="active">History</a>
			</div>
		</nav>

		<div class="page-header">
			<div class="hero">
				<h1>History</h1>
				<p>See the full record of all lost and found items here.</p>
			</div>
		</div>

		<div class="main-container">
			<div class="summary-cards">
				<div class="summary-card lost-card">
					<div class="number" id="sumLost">0</div>
					<div class="label">Total Lost</div>
				</div>
				<div class="summary-card found-card">
					<div class="number" id="sumFound">0</div>
					<div class="label">Total Found</div>
				</div>
				<div class="summary-card claimed-card">
					<div class="number" id="sumClaimed">0</div>
					<div class="label">Claimed</div>
				</div>
				<div class="summary-card open-card">
					<div class="number" id="sumOpen">0</div>
					<div class="label">Still Open</div>
				</div>
				<div class="summary-card">
					<div
						class="number"
						id="sumTop"
						style="font-size: 1.3rem; color: var(--navy)"
					>
						—
					</div>
					<div class="label">Most Common Category</div>
				</div>
			</div>

			<div class="history-controls">
				<div class="search-wrap" style="flex: 1; min-width: 200px">
					<input type="text" id="histSearch" placeholder="Search history…" />
				</div>
				<div class="filter-group">
					<button class="filter-btn active" data-type="all">All Types</button>
					<button class="filter-btn lost" data-type="lost">Lost</button>
					<button class="filter-btn found" data-type="found">Found</button>
				</div>
				<div class="filter-group">
					<button class="filter-btn active" data-status="all">
						All Status
					</button>
					<button class="filter-btn open" data-status="open">Open</button>
					<button class="filter-btn claimed" data-status="claimed">
						Claimed
					</button>
				</div>
			</div>

			<div class="table-wrap" style="margin-bottom: 48px">
				<table id="histTable">
					<thead>
						<tr>
							<th onclick="sortBy('type')">Type ↕</th>
							<th onclick="sortBy('itemname')">Item Name ↕</th>
							<th>Category</th>
							<th>Location</th>
							<th>Contact</th>
							<th onclick="sortBy('status')">Status ↕</th>
							<th onclick="sortBy('createdAt')">Date Posted ↕</th>
						</tr>
					</thead>

					<tbody id="histBody"></tbody>
				</table>
			</div>
		</div>

		<script type="module" src="history.js"></script>
	</body>
</html>
